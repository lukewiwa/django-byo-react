name: Test (JS)

on:
  workflow_call:
  push:
    paths:
      - "js/**"
      - ".github/workflows/test-js.yml"

defaults:
  run:
    working-directory: js

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: js/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
