name: Run Tests

on:
  workflow_call:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Pythons
        run: uv python install 3.11 3.12 3.13 3.14

      - name: Run tests
        run: make test
