[tox]
requires = tox-uv>=1.37
env_list =
    lint
    py311-django52
    py{312,313,314}-django{52,60,61}

[testenv]
deps =
    django52: Django>=5.2,<5.3
    django60: Django>=6.0,<6.1
    django61: Django>=6.1,<6.2
commands = python -m django test --settings=tests.settings {posargs:tests}

[testenv:lint]
skip_install = true
dependency_groups = dev
commands =
    ruff format --check .
    ruff check .
    pyright
