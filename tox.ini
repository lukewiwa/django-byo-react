[tox]
requires =
    tox>=4.67
    tox-uv>=1.37
env_list =
    lint
    py311-django52
    py{312,313,314}-django{52,60,61}
    py315-django61

[testenv]
package = wheel
deps =
    django52: Django>=5.2,<5.3
    django60: Django>=6.0,<6.1
    django61: Django>=6.1,<6.2
set_env =
    PYTHONDEVMODE = 1
commands =
    python -W error::DeprecationWarning -W error::PendingDeprecationWarning manage.py test tests {posargs}

[testenv:lint]
base_python = py311
skip_install = true
dependency_groups = dev
commands =
    ruff format --check .
    ruff check .
    pyright
