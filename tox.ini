[tox]
requires = tox-uv
toxworkdir = /tmp/.tox
envlist =
    lint
    py311-django52
    py{312,313,314}-django{52,60,61}

[testenv]
commands = python manage.py test tests
deps =
    django52: Django>=5.2,<6.0
    django60: Django>=6.0,<6.1
    django61: Django>=6.1,<6.2

[testenv:lint]
base_python = py313
skip_install = true
deps = ruff
commands =
    ruff format --check .
    ruff check .
