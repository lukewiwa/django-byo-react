[project]
name = "django-byo-react"
version = "1.0.0"
description = "A template tag to create a div and json script tag for react to bind to"
authors = [{ name = "lukewiwa", email = "luke.wiwa@gmail.com" }]
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Framework :: Django",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Framework :: Django :: 6.1",
]
requires-python = ">=3.11"
dependencies = ["django>=5.2"]

[project.urls]
Homepage = "https://github.com/lukewiwa/django-byo-react"
Repository = "https://github.com/lukewiwa/django-byo-react"
Issues = "https://github.com/lukewiwa/django-byo-react/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatchling.build.targets.wheel]
packages = ["django_byo_react"]

[tool.pyright]
typeCheckingMode = "basic"

[dependency-groups]
dev = [
  "tox>=4.30",
  "tox-uv>=1.28",
  "ruff>=0.14",
  "pyright>=1.1.400",
  "django-types>=0.22",
]
